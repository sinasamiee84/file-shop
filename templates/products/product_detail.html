{% extends 'base.html' %}
{% block title %}{{ product.title }}{% endblock %}

{% block content %}
<div class="auth-card">
    {% if product.cover %}
        <img src="{{ product.cover.url }}" alt="{{ product.title }}" style="width: 100%; border-radius: 16px; margin-bottom: 20px;">
    {% endif %}
    
    <h1 style="margin-bottom: 10px;">{{ product.title }}</h1>
    <p style="color: var(--muted); margin-bottom: 20px;">دسته بندی: {{ product.category.name }}</p>
    
    <div style="line-height: 1.8; margin-bottom: 30px;">
        {{ product.description }}
    </div>

    <div style="border-top: 1px solid var(--border); padding-top: 20px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 1.4rem; font-weight: 900; color: var(--primary);">{{ product.price }} تومان</span>
        
        <form method="post" action="#">
            {% csrf_token %}
            <button class="submit-button" style="width: auto; padding: 0 30px;">افزودن به سبد خرید</button>
        </form>
    </div>
</div>
{% endblock %}
