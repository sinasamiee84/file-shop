{% extends "base.html" %}

{% block title %}خطا در ارتباط با درگاه{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <div class="auth-card p-5 text-center" style="background: var(--surface); border: 1px solid var(--border); border-radius: 20px;">
        <h2 class="mb-3" style="color: var(--danger, #dc3545);">خطا در اتصال به درگاه پرداخت</h2>
        <p class="text-muted mb-4">متأسفانه در ارتباط با سرور زرین‌پال خطایی رخ داد.</p>
        
        <div style="background: var(--bg); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.85rem; color: var(--danger);">
            {{ error }}
        </div>

        <a href="{% url 'cart:detail' %}" style="display: inline-block; padding: 12px 24px; background: var(--primary); color: white; border-radius: 10px; text-decoration: none; font-weight: 600;">بازگشت به سبد خرید</a>
    </div>
</div>
{% endblock %}
