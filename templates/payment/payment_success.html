{% extends "base.html" %}

{% block title %}پرداخت موفق{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <div class="auth-card p-5 text-center" style="background: var(--surface); border: 1px solid var(--border); border-radius: 20px;">
        <div style="font-size: 3rem; color: var(--success); margin-bottom: 16px;">✔</div>
        <h2 class="mb-3" style="color: var(--success);">پرداخت با موفقیت انجام شد!</h2>
        <p class="text-muted mb-4">سفارش شماره <strong>#{{ order.id }}</strong> با موفقیت ثبت و پرداخت گردید.</p>
        
        <div style="background: var(--bg); padding: 16px; border-radius: 12px; margin-bottom: 24px; font-size: 0.95rem;">
            <div>کد پیگیری تراکنش: <strong>{{ ref_id }}</strong></div>
            <div>مبلغ پرداختی: <strong>{{ order.total_price }} تومان</strong></div>
        </div>

        <a href="/" class="submit-button" style="display: inline-block; padding: 12px 24px; background: var(--primary); color: white; border-radius: 10px; text-decoration: none; font-weight: 600;">بازگشت به صفحه اصلی</a>
    </div>
</div>
{% endblock %}
